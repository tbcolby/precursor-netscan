[package]
name = "netscan"
version = "0.2.0"
authors = ["Tyler Colby"]
edition = "2021"
description = "Net Check for Precursor: subnet calculator, port reference and rate-limited TCP connect checks (not a scanner)"
license = "Apache-2.0"

# Lives at xous-core/apps/netscan/ (see xous-dev-toolkit/bin/integrate).
[dependencies]
log = "0.4.14"
num-derive = { version = "0.4.2", default-features = false }
num-traits = { version = "0.2.14", default-features = false }
xous = "0.9.71"
log-server = { package = "xous-api-log", version = "0.1.70" }
xous-names = { package = "xous-api-names", version = "0.9.72" }
gam = { path = "../../services/gam" }
precursor-appkit = { path = "../../libs/precursor-appkit" }
netscan-core = { path = "core" }

[features]
default = []
